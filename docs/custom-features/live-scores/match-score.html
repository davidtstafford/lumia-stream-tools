<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Match Score</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap"
    rel="stylesheet"
  />
  <style>
    /* ─────────────────────────────────────────────────────
       CUSTOMISATION — change these values to match your brand
       ───────────────────────────────────────────────────── */
    :root {
      --accent-color:    #e8c120;             /* Score highlight / live dot */
      --accent-glow:     rgba(232,193,32,0.28);
      --bg-color:        rgba(8, 8, 18, 0.88);
      --row-bg:          rgba(255, 255, 255, 0.06);
      --row-border:      rgba(255, 255, 255, 0.10);
      --text-primary:    #ffffff;
      --text-secondary:  rgba(255,255,255,0.55);
      --live-color:      #ff4141;
      --font-family:     'Poppins', sans-serif;
    }

    /* ─────────────────────────────────────────────────────
       BASE RESET — transparent background for OBS
       ───────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: transparent;  /* transparent in OBS — white in browser preview */
      font-family: var(--font-family);
      overflow: hidden;
      width: 520px;
      padding: 10px;
    }

    /* ─────────────────────────────────────────────────────
       CARD
       ───────────────────────────────────────────────────── */
    .card {
      background: var(--bg-color);
      border-radius: 14px;
      border: 1px solid var(--row-border);
      padding: 14px 18px 18px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    /* ─────────────────────────────────────────────────────
       HEADER
       ───────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--row-border);
    }

    .header-icon { font-size: 18px; line-height: 1; }

    .header-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-primary);
    }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ─── LIVE badge ─── */
    .live-badge {
      display: none;         /* hidden until we know the match is live */
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
      color: var(--live-color);
      letter-spacing: 0.06em;
    }
    .live-badge.visible { display: flex; }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--live-color);
      animation: pulse 1.4s ease-in-out infinite;
    }

    .period-label {
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 600;
    }

    /* ─────────────────────────────────────────────────────
       STATUS MESSAGES (loading / error / scheduled)
       ───────────────────────────────────────────────────── */
    .state-msg {
      text-align: center;
      padding: 24px 0;
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.5;
    }

    /* ─────────────────────────────────────────────────────
       SCOREBOARD
       ───────────────────────────────────────────────────── */
    .scoreboard {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ─── Team block ─── */
    .team {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .team-logo-wrap {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--row-bg);
      border: 1px solid var(--row-border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .team-logo {
      width: 46px;
      height: 46px;
      object-fit: contain;
    }

    /* Shown when logo fails to load */
    .team-initials {
      font-size: 17px;
      font-weight: 900;
      color: var(--text-secondary);
    }

    .team-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
      text-align: center;
      line-height: 1.3;
    }

    /* ─── Central score block ─── */
    .score-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .scores {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .score {
      font-size: 52px;
      font-weight: 900;
      color: var(--text-primary);
      line-height: 1;
      min-width: 56px;
      text-align: center;
    }

    .score-divider {
      font-size: 30px;
      font-weight: 300;
      color: var(--text-secondary);
      line-height: 1;
    }

    .match-clock {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent-color);
      letter-spacing: 0.04em;
      min-height: 18px;
      text-align: center;
    }

    .match-date {
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 400;
      text-align: center;
    }

    /* ─────────────────────────────────────────────────────
       ANIMATIONS
       ───────────────────────────────────────────────────── */
    @keyframes pulse {
      0%, 100% { opacity: 1;   transform: scale(1);   }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }

    @keyframes scoreFlash {
      0%   { color: var(--text-primary); transform: scale(1);   }
      30%  { color: var(--accent-color); transform: scale(1.18); }
      100% { color: var(--text-primary); transform: scale(1);   }
    }

    .score.changed {
      animation: scoreFlash 0.55s ease forwards;
    }
  </style>
</head>
<body>

  <div class="card">

    <div class="header">
      <span class="header-icon">�️</span>
      <span class="header-title">Live Score</span>
      <div class="header-right">
        <span class="live-badge" id="live-badge">
          <span class="live-dot"></span>LIVE
        </span>
        <span class="period-label" id="period-label"></span>
      </div>
    </div>

    <!-- Shown while loading, or on error -->
    <div id="state-msg" class="state-msg">Fetching match data…</div>

    <!-- Hidden until data loads successfully -->
    <div id="scoreboard" class="scoreboard" style="display:none;">

      <!-- Home team -->
      <div class="team">
        <div class="team-logo-wrap">
          <img
            class="team-logo"
            id="home-logo"
            src=""
            alt=""
            onerror="this.style.display='none'; document.getElementById('home-initials').style.display='';"
          />
          <span class="team-initials" id="home-initials" style="display:none;"></span>
        </div>
        <div class="team-name" id="home-name"></div>
      </div>

      <!-- Scores + clock -->
      <div class="score-block">
        <div class="scores">
          <span class="score" id="home-score">—</span>
          <span class="score-divider">–</span>
          <span class="score" id="away-score">—</span>
        </div>
        <div class="match-clock" id="match-clock"></div>
        <div class="match-date"  id="match-date"></div>
      </div>

      <!-- Away team -->
      <div class="team">
        <div class="team-logo-wrap">
          <img
            class="team-logo"
            id="away-logo"
            src=""
            alt=""
            onerror="this.style.display='none'; document.getElementById('away-initials').style.display='';"
          />
          <span class="team-initials" id="away-initials" style="display:none;"></span>
        </div>
        <div class="team-name" id="away-name"></div>
      </div>

    </div>
  </div>

  <script>
    'use strict';

    // ═══════════════════════════════════════════════════════════════════════════
    //  ► CONFIG
    //
    //  How to set up:
    //    1. Go to sofascore.com, open the match you want to show (any sport
    //       Sofascore covers works — football, rugby league, rugby union, etc.).
    //    2. Copy the URL from your browser's address bar — e.g.:
    //       https://www.sofascore.com/football/match/newcastle-united-tottenham-hotspur/IO#id:16363256
    //    3. Paste it into MATCH_URL below and save.
    //    4. In OBS: Add a Browser Source → tick "Local File" → browse to this
    //       file → set width 520, height 130.
    //
    //  ── EASIER ALTERNATIVE — search by team name instead ──────────────────
    //  Don't want to hunt for the exact match URL? Leave MATCH_URL blank and
    //  set TEAM_FILTER to part of a team's name instead, e.g.:
    //    const MATCH_URL   = '';
    //    const TEAM_FILTER = 'Roosters';
    //  The overlay will automatically find that team's live match in whatever
    //  sport is set in SPORT_SLUG below (falling back to today's scheduled
    //  kickoff if nothing is live yet). MATCH_URL always takes priority.
    //
    //  The overlay refreshes automatically every REFRESH_INTERVAL_MS ms.
    //
    //  Sofascore's public API generally allows direct browser requests (unlike
    //  ESPN's), so no CORS proxy is needed in most cases. CORS_PROXIES is kept
    //  as a fallback in case Sofascore ever blocks a direct request.
    // ═══════════════════════════════════════════════════════════════════════════
    //const MATCH_URL           = 'https://www.sofascore.com/rugby/match/south-africa-new-zealand/CJbsGJb#id:16651327';
    const MATCH_URL           = 'https://www.sofascore.com/football/match/newcastle-united-tottenham-hotspur/IO#id:16363256';
    const TEAM_FILTER         = '';   // part of a team name, case-insensitive (used only when MATCH_URL is blank)
    const SPORT_SLUG          = 'rugby-league';  // Sofascore sport slug for TEAM_FILTER auto-detect, e.g. 'football', 'rugby-union'
    const HALF_LENGTH_MIN     = 40;   // half length in minutes, used for the ~live-minute estimate (45 for football)
    const REFRESH_INTERVAL_MS = 30_000;   // 30 seconds
    // ═══════════════════════════════════════════════════════════════════════════

    // ─── Parse the numeric match ID out of a Sofascore URL ────────────────────
    // Sofascore URLs typically end with a "#id:12345678" fragment. As a
    // fallback (in case that fragment isn't present when copied), we also
    // accept a bare numeric path segment, or the last long digit run anywhere
    // in the URL.
    function parseSofascoreId(url) {
      let m = url.match(/#id:(\d+)/);
      if (m) return m[1];

      m = url.match(/\/(\d{5,})(?:[/?#]|$)/);
      if (m) return m[1];

      const all = url.match(/\d{5,}/g);
      if (all && all.length) return all[all.length - 1];

      return null;
    }

    const eventId = MATCH_URL ? parseSofascoreId(MATCH_URL) : null;

    if (MATCH_URL && !eventId) {
      setStateMsg('⚠ Could not read a match ID from MATCH_URL.\nMake sure you copied the full Sofascore match URL, including the "#id:" part.');
    } else if (!MATCH_URL && !TEAM_FILTER) {
      setStateMsg('⚠ Set MATCH_URL or TEAM_FILTER in the CONFIG section at the top of this file.');
    }

    // ─── DOM refs ─────────────────────────────────────────────────────────────
    const stateMsgEl   = document.getElementById('state-msg');
    const scoreboardEl = document.getElementById('scoreboard');
    const liveBadgeEl  = document.getElementById('live-badge');
    const periodEl     = document.getElementById('period-label');
    const homeScoreEl  = document.getElementById('home-score');
    const awayScoreEl  = document.getElementById('away-score');
    const homeNameEl   = document.getElementById('home-name');
    const awayNameEl   = document.getElementById('away-name');
    const homeLogoEl   = document.getElementById('home-logo');
    const awayLogoEl   = document.getElementById('away-logo');
    const homeInitEl   = document.getElementById('home-initials');
    const awayInitEl   = document.getElementById('away-initials');
    const clockEl      = document.getElementById('match-clock');
    const dateEl       = document.getElementById('match-date');

    // ─── Track previous scores to detect changes ──────────────────────────────
    let prevHomeScore = null;
    let prevAwayScore = null;

    // ─── Helpers ──────────────────────────────────────────────────────────────
    function setStateMsg(msg) {
      stateMsgEl.textContent      = msg;
      stateMsgEl.style.display    = '';
      scoreboardEl.style.display  = 'none';
    }

    /** Returns up to 3 uppercase initials from a team name. */
    function toInitials(name) {
      return name.split(/\s+/).map(w => w[0] || '').join('').slice(0, 3).toUpperCase();
    }

    /** Sets a team logo, falling back to initials if src is empty. */
    function applyLogo(imgEl, initEl, logoUrl, teamName) {
      if (logoUrl) {
        imgEl.src            = logoUrl;
        imgEl.alt            = teamName;
        imgEl.style.display  = '';
        initEl.style.display = 'none';
      } else {
        imgEl.style.display  = 'none';
        initEl.textContent   = toInitials(teamName);
        initEl.style.display = '';
      }
    }

    /** Triggers the score-change flash animation. */
    function flashScore(el) {
      el.classList.remove('changed');
      void el.offsetWidth;          // force reflow so animation restarts
      el.classList.add('changed');
    }

    // ─── Sofascore API fetch ────────────────────────────────────────────────────
    // Sofascore's public API generally sends permissive CORS headers, so we try
    // a direct request first. CORS_PROXIES are only used as a fallback in case
    // that ever changes or Cloudflare blocks the direct request.
    const CORS_PROXIES = [
      'https://corsproxy.io/?',              // fallback 1
      'https://api.allorigins.win/raw?url=', // fallback 2 (different IP range)
    ];

    /** Fetches a URL as JSON, trying direct access first, then CORS proxies. */
    async function fetchJson(url) {
      const attempts = [url, ...CORS_PROXIES.map(p => p + encodeURIComponent(url))];

      let lastStatus = null;
      let lastError;
      for (const attemptUrl of attempts) {
        try {
          const res = await fetch(attemptUrl, {
            headers: { 'Accept': 'application/json' },
          });
          if (res.ok) {
            const text = await res.text();
            try {
              return JSON.parse(text);
            } catch {
              // Proxy returned 200 but body isn't JSON — try the next attempt
              lastError = new Error(`Non-JSON response from ${attemptUrl}`);
              continue;
            }
          }
          lastStatus = res.status;
          lastError  = new Error(`Sofascore returned ${res.status} — ${attemptUrl}`);
        } catch (err) {
          lastError = err;
        }
      }

      if (lastError) lastError.httpStatus = lastStatus;
      throw lastError;
    }

    /**
     * Resolves the match to display, either from a fixed MATCH_URL or by
     * searching live (then today's scheduled) matches in SPORT_SLUG for a
     * team name matching TEAM_FILTER. Returns a Sofascore "event" object.
     */
    async function fetchEventObject() {
      if (eventId) {
        const data = await fetchJson(`https://api.sofascore.com/api/v1/event/${eventId}`);
        if (!data?.event) throw new Error('Unexpected response shape from Sofascore.');
        return data.event;
      }

      if (!TEAM_FILTER) {
        const err = new Error('Set MATCH_URL or TEAM_FILTER in the CONFIG section.');
        err.configError = true;
        throw err;
      }

      const filterLower = TEAM_FILTER.toLowerCase();
      const matchesFilter = (ev) =>
        (ev.homeTeam?.name || '').toLowerCase().includes(filterLower) ||
        (ev.awayTeam?.name || '').toLowerCase().includes(filterLower);

      // 1) Currently live matches in SPORT_SLUG
      const live = await fetchJson(`https://api.sofascore.com/api/v1/sport/${SPORT_SLUG}/events/live`);
      const liveMatch = (live?.events || []).find(matchesFilter);
      if (liveMatch) return liveMatch;

      // 2) Fall back to today's scheduled matches (shows kickoff time if not started)
      const today = new Date().toISOString().slice(0, 10);
      const scheduled = await fetchJson(`https://api.sofascore.com/api/v1/sport/${SPORT_SLUG}/scheduled-events/${today}`);
      const scheduledMatch = (scheduled?.events || []).find(matchesFilter);
      if (scheduledMatch) return scheduledMatch;

      const err = new Error(`No live or scheduled-today ${SPORT_SLUG} match found for "${TEAM_FILTER}".`);
      err.notFound = true;
      throw err;
    }

    /**
     * Best-effort live match minute, e.g. "~62'".
     * Sofascore doesn't return a ready-made display clock for every sport, so
     * this estimates elapsed time from the current period's start timestamp,
     * using HALF_LENGTH_MIN (set in CONFIG) as the length of the first half.
     */
    function computeLiveMinute(event) {
      const start = event?.time?.currentPeriodStartTimestamp;
      if (!start) return '';

      const elapsedSec = Math.floor(Date.now() / 1000 - start);
      if (elapsedSec < 0) return '';

      const description = (event.status?.description || '').toLowerCase();
      const baseMin      = description.includes('2nd') ? HALF_LENGTH_MIN : 0;

      return `~${baseMin + Math.floor(elapsedSec / 60)}'`;
    }

    // ─── Main render ──────────────────────────────────────────────────────────
    async function fetchAndRender() {
      if (!eventId && !TEAM_FILTER) return;

      let event;
      try {
        event = await fetchEventObject();
      } catch (err) {
        let hint;
        if (err.configError) {
          hint = String(err.message);
        } else if (err.notFound) {
          hint = `${err.message}\nCheck the spelling in TEAM_FILTER, or set MATCH_URL instead.`;
        } else if (err.httpStatus === 404) {
          hint = 'Sofascore returned 404 — match ID not found. Paste a valid Sofascore match URL into MATCH_URL.';
        } else if (err.httpStatus === 403) {
          hint = 'Sofascore returned 403 — request was blocked. This is rare; try again shortly.';
        } else {
          hint = String(err);
        }
        setStateMsg(`⚠ Could not load match data. Will retry in ${REFRESH_INTERVAL_MS / 1000}s.\n${hint}`);
        console.error('[rugby-score overlay]', err);
        return;
      }

      const home = event.homeTeam;
      const away = event.awayTeam;

      if (!home || !away) {
        setStateMsg('⚠ Could not find both teams in the API response.');
        return;
      }

      // ── Team info ───────────────────────────────────────────────────────────
      const homeName  = home.name ?? home.shortName ?? 'Home';
      const awayName  = away.name ?? away.shortName ?? 'Away';
      const homeScore = event.homeScore?.current ?? event.homeScore?.display ?? '—';
      const awayScore = event.awayScore?.current ?? event.awayScore?.display ?? '—';
      const homeLogo  = home.id ? `https://api.sofascore.com/api/v1/team/${home.id}/image` : null;
      const awayLogo  = away.id ? `https://api.sofascore.com/api/v1/team/${away.id}/image` : null;

      homeNameEl.textContent = homeName;
      awayNameEl.textContent = awayName;
      applyLogo(homeLogoEl, homeInitEl, homeLogo, homeName);
      applyLogo(awayLogoEl, awayInitEl, awayLogo, awayName);

      // ── Scores (flash if changed since last poll) ───────────────────────────
      if (homeScore !== prevHomeScore) {
        homeScoreEl.textContent = homeScore;
        if (prevHomeScore !== null) flashScore(homeScoreEl);
        prevHomeScore = homeScore;
      }
      if (awayScore !== prevAwayScore) {
        awayScoreEl.textContent = awayScore;
        if (prevAwayScore !== null) flashScore(awayScoreEl);
        prevAwayScore = awayScore;
      }

      // ── Match status ────────────────────────────────────────────────────────
      const status     = event.status ?? {};
      const statusType  = (status.type ?? '').toLowerCase();  // 'notstarted' | 'inprogress' | 'finished' | ...
      const isLive      = statusType === 'inprogress';
      const isScheduled = statusType === 'notstarted';

      liveBadgeEl.classList.toggle('visible', isLive);
      periodEl.textContent = status.description ?? '';
      clockEl.textContent  = isLive ? computeLiveMinute(event) : '';

      // Kick-off date — shown when match hasn't started yet
      if (isScheduled && event.startTimestamp) {
        const kickoff = new Date(event.startTimestamp * 1000);
        dateEl.textContent = kickoff.toLocaleString([], {
          weekday: 'short', month: 'short', day: 'numeric',
          hour: '2-digit', minute: '2-digit',
        });
      } else {
        dateEl.textContent = '';
      }

      // ── Reveal scoreboard ───────────────────────────────────────────────────
      stateMsgEl.style.display     = 'none';
      scoreboardEl.style.display   = '';
    }

    // ─── Bootstrap ────────────────────────────────────────────────────────────
    if (eventId || TEAM_FILTER) {
      fetchAndRender();
      setInterval(fetchAndRender, REFRESH_INTERVAL_MS);
    }
  </script>
</body>
</html>
