<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Leaderboard</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    /* ─────────────────────────────────────────────────────
       CUSTOMISATION — change these values to match your brand
       ───────────────────────────────────────────────────── */
    :root {
      --accent-color:   #9147ff;          /* Bar fill & rank highlight */
      --accent-glow:    rgba(145,71,255,0.35);
      --bg-color:       rgba(8, 8, 18, 0.88);
      --row-bg:         rgba(255, 255, 255, 0.06);
      --row-border:     rgba(255, 255, 255, 0.10);
      --text-primary:   #ffffff;
      --text-secondary: rgba(255,255,255,0.55);
      --gold:   #ffd700;
      --silver: #c0c0c0;
      --bronze: #cd7f32;
      --font-family:    'Poppins', sans-serif;
      --max-entries:    5;
    }

    /* ─────────────────────────────────────────────────────
       BASE RESET — transparent background for OBS
       ───────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: transparent;  /* transparent in OBS — white in browser preview */
      font-family: var(--font-family);
      overflow: hidden;
      width: 400px;
      padding: 10px;
    }

    /* ─────────────────────────────────────────────────────
       CARD WRAPPER
       ───────────────────────────────────────────────────── */
    .card {
      background: var(--bg-color);
      border-radius: 14px;
      border: 1px solid var(--row-border);
      padding: 16px 18px 14px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    /* ─────────────────────────────────────────────────────
       HEADER
       ───────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .header-icon {
      font-size: 20px;
      line-height: 1;
    }

    .header-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-primary);
    }

    .header-subtitle {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    /* ─────────────────────────────────────────────────────
       STATUS LINE (shown when no data yet)
       ───────────────────────────────────────────────────── */
    .status {
      text-align: center;
      padding: 24px 0;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 400;
    }

    .status .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-color);
      margin-right: 6px;
      animation: pulse 1.4s ease-in-out infinite;
    }

    /* ─────────────────────────────────────────────────────
       LEADERBOARD ROWS
       ───────────────────────────────────────────────────── */
    .entries {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .entry {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--row-bg);
      border: 1px solid var(--row-border);
      overflow: hidden;
      /* Animate rows in/out as ranking changes */
      transition: transform 0.35s ease, opacity 0.35s ease;
    }

    /* Progress bar behind the row */
    .entry::before {
      content: '';
      position: absolute;
      inset: 0;
      left: 0;
      width: var(--bar-pct, 0%);
      background: linear-gradient(90deg, var(--accent-color), transparent);
      opacity: 0.18;
      border-radius: 8px;
      transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* First place glow */
    .entry[data-rank="1"] {
      border-color: var(--gold);
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
    }

    /* Rank badge */
    .rank {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
      background: rgba(255,255,255,0.10);
      color: var(--text-secondary);
    }

    .entry[data-rank="1"] .rank { background: var(--gold);   color: #000; }
    .entry[data-rank="2"] .rank { background: var(--silver); color: #000; }
    .entry[data-rank="3"] .rank { background: var(--bronze); color: #000; }

    /* Username */
    .username {
      flex: 1;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      position: relative;
    }

    /* Message count */
    .count {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-color);
      position: relative;
      flex-shrink: 0;
    }

    .count-label {
      font-size: 10px;
      font-weight: 400;
      color: var(--text-secondary);
      margin-left: 2px;
      position: relative;
    }

    /* ─────────────────────────────────────────────────────
       NEW-ENTRY ANIMATION
       ───────────────────────────────────────────────────── */
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-12px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .entry.new {
      animation: slideIn 0.35s ease forwards;
    }

    /* ─────────────────────────────────────────────────────
       PULSE DOT ANIMATION
       ───────────────────────────────────────────────────── */
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }

    /* ─────────────────────────────────────────────────────
       SCORE BUMP — brief highlight when someone's count goes up
       ───────────────────────────────────────────────────── */
    @keyframes bump {
      0%   { color: var(--accent-color); }
      40%  { color: #ffffff; transform: scale(1.3); }
      100% { color: var(--accent-color); transform: scale(1); }
    }

    .count.bump {
      animation: bump 0.5s ease forwards;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <span class="header-icon">🏆</span>
      <span class="header-title">Top Chatters</span>
      <span class="header-subtitle" id="total-messages"></span>
    </div>

    <div id="status" class="status">
      <span class="dot"></span>Waiting for chat...
    </div>

    <div id="entries" class="entries" style="display:none;"></div>
  </div>

  <script>
    'use strict';

    // ─── Config ────────────────────────────────────────────────────────────────
    const MAX_ENTRIES    = 5;          // How many rows to show
    const WS_URL         = 'ws://localhost:39231';
    const RECONNECT_MS   = 3000;       // How long to wait before reconnecting

    // ─── State ─────────────────────────────────────────────────────────────────
    /** @type {Map<string, number>} username → message count */
    const scores = new Map();
    let totalMessages = 0;

    // ─── DOM refs ──────────────────────────────────────────────────────────────
    const statusEl   = document.getElementById('status');
    const entriesEl  = document.getElementById('entries');
    const totalEl    = document.getElementById('total-messages');

    // ─── Render ────────────────────────────────────────────────────────────────
    /**
     * Rebuild the leaderboard DOM from current scores.
     * Uses a key-based diff to only touch rows that changed.
     */
    function render() {
      // Sort descending by count, take top N
      const sorted = [...scores.entries()]
        .sort((a, b) => b[1] - a[1])
        .slice(0, MAX_ENTRIES);

      if (sorted.length === 0) {
        statusEl.style.display  = '';
        entriesEl.style.display = 'none';
        return;
      }

      statusEl.style.display  = 'none';
      entriesEl.style.display = '';

      const topScore = sorted[0][1]; // for bar width calculation

      // Collect existing rows by username for diffing
      const existingRows = new Map();
      for (const row of entriesEl.querySelectorAll('.entry')) {
        existingRows.set(row.dataset.username, row);
      }

      const newOrder = [];

      sorted.forEach(([username, count], index) => {
        const rank   = index + 1;
        const barPct = topScore > 0 ? Math.round((count / topScore) * 100) : 0;

        let row = existingRows.get(username);

        if (row) {
          // Row exists — update values
          const countEl = row.querySelector('.count');
          const oldCount = parseInt(countEl.dataset.value || '0', 10);

          if (oldCount !== count) {
            countEl.textContent    = count;
            countEl.dataset.value  = count;
            // Flash the score
            countEl.classList.remove('bump');
            void countEl.offsetWidth; // force reflow to restart animation
            countEl.classList.add('bump');
          }

          row.dataset.rank = rank;
          row.querySelector('.rank').textContent = rank;
          row.style.setProperty('--bar-pct', barPct + '%');
        } else {
          // New row
          row = buildRow(username, rank, count, barPct);
          existingRows.set(username, row);
        }

        newOrder.push(row);
      });

      // Remove rows that dropped out of the top N
      for (const [username, row] of existingRows) {
        if (!newOrder.includes(row)) row.remove();
      }

      // Re-order DOM to match current ranking
      newOrder.forEach((row, i) => {
        if (entriesEl.children[i] !== row) {
          entriesEl.insertBefore(row, entriesEl.children[i] || null);
        }
      });

      // Update total messages badge
      totalEl.textContent = `${totalMessages.toLocaleString()} msgs`;
    }

    /**
     * Build a brand-new entry row element.
     */
    function buildRow(username, rank, count, barPct) {
      const row = document.createElement('div');
      row.className      = 'entry new';
      row.dataset.rank     = rank;
      row.dataset.username = username;
      row.style.setProperty('--bar-pct', barPct + '%');

      row.innerHTML = `
        <div class="rank">${rank}</div>
        <div class="username">${escapeHtml(username)}</div>
        <div class="count" data-value="${count}">${count}</div>
        <span class="count-label">msgs</span>
      `;

      // Remove the animation class after it plays so re-inserts can retrigger it
      row.addEventListener('animationend', () => row.classList.remove('new'), { once: true });

      entriesEl.appendChild(row);
      return row;
    }

    // ─── Event handling ────────────────────────────────────────────────────────

    /**
     * Handle an incoming Lumia Stream WebSocket message.
     * We only care about chat events.
     */
    function handleMessage(raw) {
      let payload;
      try {
        payload = JSON.parse(raw);
      } catch {
        return; // ignore non-JSON frames
      }

      // Lumia Stream wraps event data under payload.data
      const data = payload?.data;
      if (!data) return;

      // Only count chat messages
      if (data.type !== 'chat') return;

      const username = (data.username || data.name || '').trim();
      if (!username) return;

      // Exclude known bots — extend this list as needed
      const BOTS = new Set(['nightbot', 'streamlabs', 'streamelements', 'moobot', 'fossabot']);
      if (BOTS.has(username.toLowerCase())) return;

      scores.set(username, (scores.get(username) ?? 0) + 1);
      totalMessages++;

      render();
    }

    // ─── WebSocket with auto-reconnect ─────────────────────────────────────────

    function connect() {
      let ws;

      try {
        ws = new WebSocket(WS_URL);
      } catch (err) {
        console.warn('[Leaderboard] WebSocket constructor failed:', err);
        setTimeout(connect, RECONNECT_MS);
        return;
      }

      ws.addEventListener('open', () => {
        console.info('[Leaderboard] Connected to Lumia Stream');
      });

      ws.addEventListener('message', (event) => {
        handleMessage(event.data);
      });

      ws.addEventListener('close', () => {
        console.warn('[Leaderboard] Disconnected — reconnecting in', RECONNECT_MS, 'ms');
        setTimeout(connect, RECONNECT_MS);
      });

      ws.addEventListener('error', (err) => {
        // 'close' will fire next; no need to schedule another reconnect here
        console.warn('[Leaderboard] WebSocket error:', err);
      });
    }

    // ─── Utilities ─────────────────────────────────────────────────────────────

    /** Safely escape HTML to prevent XSS from chat usernames */
    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ─── Boot ──────────────────────────────────────────────────────────────────
    connect();
  </script>

</body>
</html>
